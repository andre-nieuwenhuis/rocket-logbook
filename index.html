<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rocket logbook</title>
<meta name="description" content="Every rocket project and every iteration: what changed, what failed, and what was fixed next.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/site.css">
<script>
(function () {
  var t = null;
  try { t = localStorage.getItem('theme'); } catch (e) {}
  document.documentElement.dataset.theme = t === 'light' ? 'light' : 'dark';
})();
</script>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
  }
}
</script>
</head>
<body data-pose="home">
<a class="skip" href="#view">Skip to content</a>
<div class="sky" aria-hidden="true"></div>
<div id="stage" aria-hidden="true"><div id="stage-view"></div><div id="stage-overlay" class="overlay"></div></div>

<header class="nav" id="nav">
  <a class="brand" href="#/" id="brand">Rocket logbook</a>
  <nav class="pill" aria-label="Main">
    <a href="#/" data-nav="home">Projects</a>
    <a href="#/compare" data-nav="compare">Compare</a>
    <a href="#/about" data-nav="about">About</a>
  </nav>
  <div class="nav-tools">
    <button class="icon-btn search-btn" id="searchBtn" aria-label="Search (press /)">
      <svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg>
      <kbd>/</kbd>
    </button>
    <button class="icon-btn" id="themeBtn" aria-label="Switch theme">
      <svg class="sun" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M5 5l2 2M17 17l2 2M19 5l-2 2M7 17l-2 2"></path></svg>
      <svg class="moon" aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M20 14A8 8 0 0 1 10 4a8 8 0 1 0 10 10z"></path></svg>
    </button>
  </div>
</header>

<div class="progress" id="progress" aria-hidden="true"></div>
<main id="view" tabindex="-1"></main>

<footer class="foot" id="foot">
  <span id="footName"></span>
  <span class="foot-links" id="ownerLinks" hidden><a href="#/guide">How to update this site</a><a href="#/builder">Builder</a></span>
</footer>

<div class="palette" id="palette" hidden>
  <div class="palette-box" role="dialog" aria-label="Search">
    <input id="paletteInput" type="search" placeholder="Search projects, iterations, parts and files" autocomplete="off" aria-label="Search">
    <ul id="paletteList"></ul>
    <div class="palette-hint"><kbd>↑</kbd><kbd>↓</kbd> move <kbd>Enter</kbd> open <kbd>Esc</kbd> close</div>
  </div>
</div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<div class="intro" id="intro" aria-hidden="true"><div class="intro-mark"><span></span>Rocket logbook</div></div>

<noscript><p style="padding:24px">This site needs JavaScript turned on.</p></noscript>
<script type="module" src="assets/js/main.js"></script>
</body>
</html>
